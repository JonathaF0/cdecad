<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CDECAD Fingerprint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
               font-family: 'Segoe UI', Tahoma, sans-serif; }

  #card {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%);
    width: 280px;
    background: #10161f;
    border: 1px solid #2b3a4d;
    border-radius: 10px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.6);
    color: #dde7f5;
    overflow: hidden;
    animation: fpSlideIn 0.25s ease-out;
  }
  #card.hidden { display: none; }
  @keyframes fpSlideIn { from { opacity: 0; transform: translateY(-50%) translateX(30px); }
                         to   { opacity: 1; transform: translateY(-50%) translateX(0); } }

  .head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: linear-gradient(180deg, #1d2a3a, #16202d);
    border-bottom: 1px solid #2b3a4d;
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  }
  .head .dot { width: 8px; height: 8px; border-radius: 50%; background: #38c172;
               box-shadow: 0 0 6px #38c172; animation: fpPulse 1.6s infinite; }
  @keyframes fpPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .printWrap {
    position: relative; margin: 12px auto 8px; width: 168px; height: 210px;
    background: #ffffff; border-radius: 6px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .printWrap img { width: 100%; height: 100%; display: block; }
  .scanline {
    position: absolute; left: 0; right: 0; height: 3px;
    background: rgba(56,193,114,0.85); box-shadow: 0 0 10px rgba(56,193,114,0.9);
    animation: fpScan 2.2s linear infinite;
  }
  @keyframes fpScan { 0% { top: 0; } 50% { top: calc(100% - 3px); } 100% { top: 0; } }

  .banner {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 0; text-align: center;
    font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: #fff;
  }
  .banner.wanted  { background: rgba(200,30,30,0.92); }
  .banner.missing { background: rgba(200,120,20,0.92); }
  .banner.hidden  { display: none; }

  .name { text-align: center; font-size: 14px; font-weight: 700; padding: 0 12px; }
  .fpid { text-align: center; font-family: 'Consolas', 'Courier New', monospace;
          font-size: 12px; color: #8fa5c0; padding: 2px 12px 0; }

  .meta { display: flex; align-items: center; justify-content: center; gap: 8px;
          padding: 8px 12px 12px; }
  .chip { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
          color: #9fd1ff; background: rgba(60,130,200,0.18);
          border: 1px solid rgba(60,130,200,0.5); border-radius: 10px; padding: 2px 10px; }
  .match { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #38c172; }
</style>
</head>
<body>
  <div id="card" class="hidden">
    <div class="head"><span class="dot"></span> BIOMETRIC SCAN RESULT</div>
    <div class="printWrap">
      <img id="printImg" alt="fingerprint">
      <div class="scanline"></div>
      <div id="wantedBanner" class="banner wanted hidden">ACTIVE WARRANT</div>
      <div id="missingBanner" class="banner missing hidden">MISSING PERSON</div>
    </div>
    <div class="name" id="fpName"></div>
    <div class="fpid" id="fpId"></div>
    <div class="meta">
      <span class="chip" id="fpPattern"></span>
      <span class="match">MATCH 100%</span>
    </div>
  </div>

  <script>
    var card = document.getElementById('card');

    function show(data) {
      document.getElementById('printImg').src = data.image || '';
      document.getElementById('fpName').textContent = data.name || 'Unknown';
      document.getElementById('fpId').textContent = data.fingerprintId || '';
      document.getElementById('fpPattern').textContent = (data.pattern || 'print') + ' pattern';
      document.getElementById('wantedBanner').classList.toggle('hidden', !data.wanted);
      document.getElementById('missingBanner').classList.toggle('hidden', !data.missing || !!data.wanted);
      card.classList.remove('hidden');
    }

    function hide() {
      card.classList.add('hidden');
      document.getElementById('printImg').src = '';
    }

    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.action === 'showFingerprint') show(d.data || {});
      else if (d.action === 'hideFingerprint') hide();
    });
  </script>
</body>
</html>
