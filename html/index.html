<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDECAD</title>
<link rel="stylesheet" href="tablet/style.css">
<link rel="stylesheet" href="civ/style.css">
</head>
<body>
  <script>
    window.__nuiBuf = [];
    window.__nuiBufHandler = function (e) { window.__nuiBuf.push(e.data); };
    window.addEventListener('message', window.__nuiBufHandler);
  </script>

  <div id="tablet" class="tablet hidden">
    <div class="tablet-frame">
      <div class="tablet-header">
        <span class="tablet-title">CDECAD</span>
        <button id="closeTablet" class="tablet-close">&times;</button>
      </div>
      <iframe id="tabletFrame" class="tablet-iframe" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" allow="clipboard-write"></iframe>
      <div id="tabletOverlay" class="tablet-overlay hidden">
        <div class="tablet-overlay-spinner"></div>
        <div id="tabletOverlayText" class="tablet-overlay-text">Loading CDECAD…</div>
        <button id="tabletOverlayRetry" class="tablet-overlay-retry hidden">Reload</button>
      </div>
    </div>
  </div>

  <style>
    .tablet-overlay {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #0b0f1a; color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .tablet-overlay.hidden { display: none; }
    .tablet-overlay-spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid rgba(205,214,244,0.18); border-top-color: #3b82f6;
      animation: tabletspin 0.9s linear infinite;
    }
    @keyframes tabletspin { to { transform: rotate(360deg); } }
    .tablet-overlay-text { font-size: 14px; opacity: 0.85; }
    .tablet-overlay-retry {
      margin-top: 4px; padding: 8px 18px; font-size: 13px; cursor: pointer;
      color: #fff; background: #3b82f6; border: none; border-radius: 8px;
    }
    .tablet-overlay-retry.hidden { display: none; }
  </style>

  <div id="callPopup" class="call-popup hidden">
    <div class="popup-header">
      <span class="popup-title">ACTIVE CALL</span>
      <span id="callCounter" class="call-counter">0 / 0</span>
    </div>
    <div id="callContent" class="popup-content">
      <div class="no-calls">No active calls</div>
    </div>
    <div id="callNav" class="popup-nav hidden">
      <button id="prevCall" class="nav-btn">&laquo; PREV</button>
      <button id="nextCall" class="nav-btn">NEXT &raquo;</button>
    </div>
  </div>

  <script src="tablet/script.js"></script>

  <script>
    function lazyIframe(src, passiveZ) {
      var f = null, loaded = false, pending = [];
      var PARENT = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'CDECAD';
      return {
        get: function () {
          if (f) return f;
          f = document.createElement('iframe');
          f.src = src;
          f.style.cssText = 'position:fixed;inset:0;width:0;height:0;border:0;background:transparent;pointer-events:none;';
          document.body.appendChild(f);
          f.addEventListener('load', function () {
            loaded = true;
            try { f.contentWindow.GetParentResourceName = function () { return PARENT; }; } catch (_) {}
            for (var i = 0; i < pending.length; i++) {
              try { f.contentWindow.postMessage(pending[i], '*'); } catch (_) {}
            }
            pending = [];
          });
          return f;
        },
        post: function (d) {
          this.get();
          if (!loaded) { pending.push(d); return; }
          try { f.contentWindow.postMessage(d, '*'); } catch (_) {}
        },
        size: function (state) {
          if (!f && state === 'closed') return;
          this._state = state;
          this._render();
        },
        _render: function () {
          var state = window.__tabletOpen ? 'closed' : (this._state || 'closed');
          if (!f && state === 'closed') return;
          var el = this.get();
          if (state === 'interactive') {
            el.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;border:0;background:transparent;pointer-events:auto;z-index:11000;';
          } else if (state === 'passive') {
            el.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;border:0;background:transparent;pointer-events:none;z-index:' + (passiveZ || 9990) + ';';
          } else {
            el.style.cssText = 'position:fixed;inset:0;width:0;height:0;border:0;background:transparent;pointer-events:none;';
          }
        }
      };
    }

    var civ    = lazyIframe('civ/index.html');
    var wraith = lazyIframe('wraith/index.html', 9993);
    var reader = lazyIframe('reader/index.html', 9990);
    var fprint = lazyIframe('fingerprint/index.html', 9991);

    var __overlays = [civ, wraith, reader, fprint];
    function renderOverlays() { for (var i = 0; i < __overlays.length; i++) __overlays[i]._render(); }
    (function () {
      var tabletEl = document.getElementById('tablet');
      if (!tabletEl || typeof MutationObserver === 'undefined') return;
      window.__tabletOpen = !tabletEl.classList.contains('hidden');
      new MutationObserver(function () {
        var open = !tabletEl.classList.contains('hidden');
        if (open !== window.__tabletOpen) { window.__tabletOpen = open; renderOverlays(); }
      }).observe(tabletEl, { attributes: true, attributeFilter: ['class'] });
    })();

    var CIV_ACTIONS      = { showID: 'passive', hideID: 'closed' };
    var WRAITH_ACTIONS   = { showPlateResult: 'passive', hidePlateResult: 'closed' };
    var READER_ACTIONS   = { readerShow: 'passive', readerHide: 'closed', readerScan: 'keep', readerEdit: 'interactive', readerEditOff: 'passive' };
    var FPRINT_ACTIONS   = { showFingerprint: 'passive', hideFingerprint: 'closed' };

    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (!d.action) return;
      if (CIV_ACTIONS[d.action] !== undefined) {
        civ.post(d);
        civ.size(CIV_ACTIONS[d.action]);
      } else if (WRAITH_ACTIONS[d.action] !== undefined) {
        wraith.post(d);
        wraith.size(WRAITH_ACTIONS[d.action]);
      } else if (READER_ACTIONS[d.action] !== undefined) {
        reader.post(d);
        var rs = READER_ACTIONS[d.action];
        if (rs !== 'keep') reader.size(rs);
      } else if (FPRINT_ACTIONS[d.action] !== undefined) {
        fprint.post(d);
        fprint.size(FPRINT_ACTIONS[d.action]);
      }
    });

    (function () {
      window.removeEventListener('message', window.__nuiBufHandler);
      var buf = window.__nuiBuf || [];
      window.__nuiBuf = null;
      for (var i = 0; i < buf.length; i++) {
        window.dispatchEvent(new MessageEvent('message', { data: buf[i] }));
      }
    })();
  </script>
</body>
</html>
